<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunday School Doctrinal Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Palette and type follow standards/03-Design-and-Brand-Standard.md, so
   what a reviewer reads on screen looks like what will print. */
:root{
  --navy:#002664; --navy-legacy:#1E4E72; --secondary:#2B65B5;
  --red:#C41230; --charcoal:#292B2C; --paper:#fdfdfb; --rule:#e3e6ea;
  --warn:#8a6d00; --warn-bg:#fff8e1; --err:#a11; --err-bg:#fdf0f0;
  --ok:#1a6b3c; --ok-bg:#f0f8f3;
  --display:"Montserrat",system-ui,sans-serif;
  --text:"Lora",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--charcoal);
     font-family:var(--text);font-size:16px;line-height:1.55}
a{color:var(--secondary)}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem}

header.top{background:var(--navy);color:#fff;padding:.9rem 0}
header.top .wrap{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header.top h1{font-family:var(--display);font-weight:600;font-size:1.05rem;
     margin:0;letter-spacing:.02em}
header.top .church{font-size:.8rem;opacity:.75;font-family:var(--display)}
header.top .spacer{flex:1}

button{font-family:var(--display);font-size:.85rem;font-weight:600;
     border-radius:5px;border:1px solid transparent;padding:.5rem .9rem;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.gbtn{display:inline-flex;align-items:center;min-height:34px}
.btn-approve{background:var(--ok);color:#fff}
.btn-changes{background:#fff;color:var(--err);border-color:var(--err)}

/* ---- Sunday index ---- */
.card{border:1px solid var(--rule);border-radius:8px;background:#fff;
      padding:1rem 1.15rem;margin:.85rem 0}
.card h2{font-family:var(--display);font-size:1.05rem;margin:0 0 .2rem}
.card .meta{font-size:.85rem;color:#5a5f66}
.pill{display:inline-block;font-family:var(--display);font-size:.7rem;
      font-weight:600;letter-spacing:.04em;text-transform:uppercase;
      padding:.2rem .5rem;border-radius:99px;margin-right:.4rem}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.neutral{background:#eef1f4;color:#41474e}

/* ---- Reading view ---- */
.piece{background:#fff;border:1px solid var(--rule);border-radius:8px;
       margin:1.5rem 0;overflow:hidden}
.piece > h2{font-family:var(--display);font-weight:600;font-size:.9rem;
     letter-spacing:.05em;text-transform:uppercase;color:#fff;
     background:var(--navy);margin:0;padding:.7rem 1.15rem}
.piece .inner{padding:.4rem 1.4rem 1.4rem}
.section h3{font-family:var(--display);font-weight:600;font-size:.78rem;
     letter-spacing:.06em;text-transform:uppercase;color:#fff;
     background:var(--navy);padding:.45rem .8rem;margin:1.4rem 0 .8rem;
     border-radius:3px}
.section h4{font-family:var(--display);font-weight:600;font-size:.86rem;
     color:var(--secondary);margin:1rem 0 .3rem}
.section p{margin:.6rem 0}
.section ul{margin:.5rem 0;padding-left:1.3rem}
blockquote{margin:.7rem 0;padding-left:1rem;border-left:3px solid var(--rule);
     color:#000}
.theme{font-family:var(--display);font-style:italic;font-weight:600;
     color:var(--secondary);text-align:center;font-size:.92rem;margin:.9rem 0 0}

/* Rule findings, shown against the piece they belong to. Muted enough
   that they do not compete with the prose being reviewed. */
.findings{border-left:3px solid var(--err);background:var(--err-bg);
     padding:.6rem .9rem;margin:.9rem 0;font-size:.85rem;font-family:var(--display)}
.findings.warnonly{border-left-color:var(--warn);background:var(--warn-bg)}
.findings h5{margin:0 0 .4rem;font-size:.75rem;letter-spacing:.05em;
     text-transform:uppercase}
.findings li{margin:.3rem 0}
.findings code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
     font-size:.82em;background:rgba(0,0,0,.05);padding:.05rem .25rem;border-radius:3px}
.findings .src{opacity:.7;font-size:.78rem}

/* ---- Approval bar ---- */
.approvebar{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--navy);
     padding:.85rem 0;box-shadow:0 -3px 12px rgba(0,0,0,.07);z-index:5}
.approvebar .wrap{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;
     color:#5a5f66}
.note{font-family:var(--text);font-size:.9rem;padding:.45rem .6rem;
     border:1px solid var(--rule);border-radius:5px;flex:1;min-width:14rem}
.banner{padding:.75rem 1rem;border-radius:6px;margin:1rem 0;font-family:var(--display);
     font-size:.88rem}
.banner.err{background:var(--err-bg);color:var(--err)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.info{background:#eef2f7;color:#2b3a4a}
.reviews{font-size:.85rem;font-family:var(--display);margin:.5rem 0}
.reviews li{margin:.2rem 0}
.hidden{display:none!important}
nav.crumbs{font-family:var(--display);font-size:.82rem;margin:1.1rem 0 .3rem}
h1.sunday{font-family:var(--display);font-weight:600;font-size:1.5rem;margin:.2rem 0}
.sub{color:#5a5f66;font-size:.95rem;margin:0 0 1rem}
@media print{
  header.top,.approvebar,nav.crumbs,.findings{display:none}
  .piece{border:none;page-break-after:always}
  .piece>h2{color:#000;background:none;border-bottom:2px solid #000}
  .section h3{color:#000;background:none;border-bottom:1px solid #999}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>Doctrinal Review</h1>
    <span class="church" id="churchName"></span>
    <span class="spacer"></span>
    <span id="who" class="church"></span>
    <!-- Google renders its own sign-in button in here. See Auth.init. -->
    <span id="gbtn" class="gbtn"></span>
    <button id="signin" class="btn-ghost hidden">Sign out</button>
  </div>
</header>

<main class="wrap" id="main">
  <p style="margin:2rem 0;color:#5a5f66">Loading…</p>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script>
"use strict";
const CFG = window.STPAUL_CONFIG || {};
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };

// Violations that block approval: the ones introduced since
// standards/lint-baseline.json, which is what the service enforces. The
// raw count is still shown, because a reviewer should see the whole
// state of the text, but it is not what decides whether he may sign.
//
// A bundle written before new_errors existed cannot tell new from known,
// so it counts everything and the button stays disabled. That is the
// same way the service fails on the same bundle, and the two must agree:
// an enabled button that the service then refuses is a worse experience
// than a disabled one that explains itself.
const blockingErrors = (lint) =>
  typeof lint?.new_errors === "number" ? lint.new_errors : (lint?.errors || 0);

// ---------------------------------------------------------------------
// Auth. Google Identity Services, so a reviewer needs no account beyond
// the one the church already uses. The ID token is held in memory only:
// it is not written to storage, so closing the tab ends the session and a
// shared church computer does not stay signed in.
//
// The token proves identity to the service. Whether that identity may
// approve anything is decided by standards/reviewers.yml in the data
// repository, which the service reads. Nothing here is authorisation.
// ---------------------------------------------------------------------
const Auth = {
  token: null,
  user: null,

  // Set once google.accounts.id has been initialised. Rendering the
  // button before that silently does nothing.
  ready: false,

  // Why signing in is impossible, when it is. Rendered as a banner.
  // Null means sign-in is available as far as this page can tell.
  problem: null,

  configured() { return !!(CFG.service && CFG.googleClientId); },

  /**
   * Set up Google Identity Services and render Google's own button as
   * the way in.
   *
   * The button is the point. This page used to offer a control of its
   * own that called google.accounts.id.prompt(), which is One Tap, and
   * One Tap declines to appear in ordinary circumstances: Google
   * suppresses it for a site after a couple of dismissals, and blocked
   * third-party cookies or a browser without FedCM suppress it outright.
   * It declines silently. No popup, no error, no callback, and no
   * request to the service, so a reviewer who could not sign in left no
   * trace anywhere, on their screen or in the Worker. A pastor found
   * that out by telephone.
   *
   * renderButton uses the popup flow, which none of that affects.
   */
  init() {
    if (!Auth.configured()) return;
    if (!window.google?.accounts?.id) {
      // The library never loaded: an extension, a network filter, or no
      // connection. Say so where it can be read, rather than waiting for
      // a click to alert about it.
      Auth.problem =
        "Google sign-in did not load. Something is blocking " +
        "accounts.google.com: a browser extension, a network filter, or " +
        "a dropped connection. Reload, or try another browser.";
      return;
    }
    google.accounts.id.initialize({
      client_id: CFG.googleClientId,
      callback: (res) => Auth.onCredential(res),
      auto_select: false,
      cancel_on_tap_outside: true,
    });
    Auth.ready = true;
    Auth.drawButton();
    Auth.oneTap();
  },

  // Google owns the markup it renders, so a button is redrawn rather
  // than hidden and shown: signing out has to leave a working one
  // behind. Returns whether it drew anything, because a caller that has
  // no button to offer needs to say something else instead.
  drawButton(box) {
    box = box || document.getElementById("gbtn");
    if (!box || !Auth.ready) return false;
    box.innerHTML = "";
    google.accounts.id.renderButton(box, {
      type: "standard", theme: "filled_blue", size: "medium",
      text: "signin_with", shape: "pill",
    });
    return true;
  },

  // One Tap, offered but never relied on. The notification callback is
  // why this is worth keeping at all: when One Tap does not appear, the
  // reason reaches the console, so "he clicked and nothing happened"
  // becomes a question somebody can answer.
  oneTap() {
    try {
      google.accounts.id.prompt((n) => {
        let why = "";
        // These readers are deprecated under FedCM and throw there.
        // Failing to explain must not become failing to sign in, so the
        // button stands on its own and this only ever reports.
        try {
          if (n.isNotDisplayed?.()) why = "was not displayed: " + n.getNotDisplayedReason?.();
          else if (n.isSkippedMoment?.()) why = "was skipped: " + n.getSkippedReason?.();
        } catch { why = "gave no reason (FedCM)"; }
        if (why) console.info("[stpaul] One Tap " + why + ". The button still works.");
      });
    } catch (e) {
      console.info("[stpaul] One Tap unavailable: " + ((e && e.message) || e));
    }
  },

  onCredential(res) {
    Auth.token = res.credential;
    try {
      const claims = JSON.parse(atob(
        res.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
      // Display only. The service verifies the token's signature; nothing
      // read here is trusted for any decision.
      Auth.user = { email: claims.email, name: claims.name || claims.email };
    } catch { Auth.user = null; }
    render();
  },

  signOut() {
    Auth.token = null; Auth.user = null;
    try { google.accounts.id.disableAutoSelect(); } catch {}
    render();
  },

  headers() {
    return Auth.token ? { Authorization: "Bearer " + Auth.token } : {};
  },
};

// Read through the service when configured, from local files when not.
// The data repository is private, so the service is the only path to
// content for anyone but a maintainer with a checkout.
const Data = {
  async index() {
    if (!CFG.service) return fetch("data/index.json").then((r) => r.json());
    const r = await fetch(CFG.service + "/sundays", { headers: Auth.headers() });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    return r.json();
  },
  async sunday(slug) {
    if (!CFG.service) return fetch(`data/${slug}.json`).then((r) => r.json());
    const r = await fetch(CFG.service + "/sunday/" + encodeURIComponent(slug),
                          { headers: Auth.headers() });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    return r.json();
  },
};

// ---------------------------------------------------------------------
// Rendering. Markdown here is deliberately minimal: the source is written
// by people, not by a generator, and a heavy parser would be one more
// place for what is read to differ from what is printed.
// ---------------------------------------------------------------------
function esc(s) { return (s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
}

function renderBody(body) {
  const out = [];
  for (const raw of (body || "").split(/\n\s*\n/)) {
    const b = raw.trim();
    if (!b) continue;
    if (/^-{3,}$/.test(b)) continue;                       // brand standard 6
    if (b.startsWith("### ")) { out.push(`<h4>${inline(b.slice(4))}</h4>`); continue; }
    if (b.startsWith("> ")) {
      out.push(`<blockquote>${inline(b.split("\n").map(l => l.replace(/^> ?/, "")).join(" "))}</blockquote>`);
      continue;
    }
    if (/^[-*]\s/.test(b)) {
      const items = b.split("\n").filter(l => /^[-*]\s/.test(l))
        .map(l => `<li>${inline(l.replace(/^[-*]\s+/, ""))}</li>`).join("");
      out.push(`<ul>${items}</ul>`); continue;
    }
    out.push(`<p>${inline(b)}</p>`);
  }
  return out.join("");
}

function findingsBlock(list) {
  if (!list || !list.length) return null;
  const errors = list.filter(f => f.severity === "error");
  const box = el("div", "findings" + (errors.length ? "" : " warnonly"));
  box.appendChild(el("h5", null,
    `${errors.length} error${errors.length === 1 ? "" : "s"}, ` +
    `${list.length - errors.length} warning${list.length - errors.length === 1 ? "" : "s"} ` +
    `against the written standards`));
  const ul = el("ul");
  for (const f of list.slice(0, 40)) {
    const li = el("li");
    li.innerHTML = `<strong>${esc(f.severity === "error" ? "Error" : "Warning")}</strong>` +
      (f.line ? ` line ${f.line}` : "") + ` — ${esc(f.message.split("\n")[0])}` +
      (f.excerpt ? ` <code>${esc(f.excerpt)}</code>` : "") +
      (f.source ? `<div class="src">${esc(f.source)}</div>` : "");
    ul.appendChild(li);
  }
  box.appendChild(ul);
  if (list.length > 40) box.appendChild(el("div", "src", `…and ${list.length - 40} more.`));
  return box;
}

// ---------------------------------------------------------------------
// Views
// ---------------------------------------------------------------------
async function viewIndex(main) {
  const idx = await Data.index();
  main.appendChild(el("h1", "sunday", "Sundays"));
  main.appendChild(el("p", "sub",
    "Each Sunday is reviewed as a whole. Approving binds your name to the exact text below it."));

  if (!idx.sundays.length) main.appendChild(el("p", null, "Nothing in content/ yet."));

  for (const s of idx.sundays) {
    const c = el("div", "card");
    const h = el("h2");
    const a = el("a", null, `${s.liturgical_day || s.sunday} · ${s.date || ""}`);
    a.href = "#" + s.sunday; h.appendChild(a); c.appendChild(h);
    c.appendChild(el("div", "meta", s.gospel || ""));

    const pills = el("div"); pills.style.marginTop = ".55rem";
    const state = s.approval_state;
    pills.appendChild(el("span", "pill " + (state === "approved" ? "ok" : "neutral"),
      state === "approved" ? "approved" : state.replace(/-/g, " ")));
    if (s.errors) pills.appendChild(el("span", "pill err", `${s.errors} errors`));
    if (s.warnings) pills.appendChild(el("span", "pill warn", `${s.warnings} warnings`));
    pills.appendChild(el("span", "pill neutral", `${s.pieces} pieces`));
    c.appendChild(pills);
    c.appendChild(el("div", "hash", "content " + (s.content_sha256 || "").slice(0, 16)));
    main.appendChild(c);
  }
}

async function viewSunday(main, slug) {
  let d;
  try { d = await Data.sunday(slug); }
  catch (e) { main.appendChild(el("div", "banner err", e.message)); return; }

  const nav = el("nav", "crumbs");
  const back = el("a", null, "← All Sundays"); back.href = "#";
  nav.appendChild(back); main.appendChild(nav);

  main.appendChild(el("h1", "sunday",
    `${d.meta.liturgical_day || slug} · ${d.meta.date || ""}`));
  main.appendChild(el("p", "sub",
    `${d.meta.gospel || ""}${d.meta.translation ? " (" + d.meta.translation + ")" : ""}`));

  const ap = d.approval;
  const banner = el("div", "banner " +
    (ap.ok ? "ok" : (blockingErrors(d.lint) ? "err" : "info")));
  banner.textContent = ap.ok
    ? "Approved. " + ap.detail
    : `${ap.detail} ${d.lint.errors} rule error(s) outstanding` +
      (typeof d.lint.new_errors === "number"
        ? `, ${d.lint.new_errors} of them introduced since the baseline.`
        : ".");
  main.appendChild(banner);

  if (ap.reviews && ap.reviews.length) {
    const box = el("div", "reviews");
    box.appendChild(el("strong", null, "Reviews on record"));
    const ul = el("ul");
    for (const r of ap.reviews) {
      const current = r.content_sha256 === d.content_sha256;
      ul.appendChild(el("li", null,
        `${r.reviewer} (${r.role}) — ${r.decision.replace("_", " ")} at ${r.at}` +
        (current ? "" : "  ·  applies to earlier text, does not count")));
    }
    box.appendChild(ul); main.appendChild(box);
  }

  const lessonFindings = findingsBlock(d.lint.by_piece._lesson);
  if (lessonFindings) main.appendChild(lessonFindings);

  for (const p of d.pieces) {
    const art = el("article", "piece");
    art.appendChild(el("h2", null, p.label));
    const inner = el("div", "inner");
    if (d.meta.theme && d.meta.theme_line_active)
      inner.appendChild(el("p", "theme", d.meta.theme));

    const fb = findingsBlock(d.lint.by_piece[p.id ? `${String(p.order).padStart(2,"0")}-${p.id}.md` : ""]);
    if (fb) inner.appendChild(fb);

    for (const s of p.sections) {
      const sec = el("div", "section");
      sec.appendChild(el("h3", null, s.heading));
      const body = el("div");
      body.innerHTML = renderBody(s.body);
      sec.appendChild(body);
      inner.appendChild(sec);
    }
    art.appendChild(inner);
    main.appendChild(art);
  }

  main.appendChild(approvalBar(d));
}

function approvalBar(d) {
  const bar = el("div", "approvebar");
  const w = el("div", "wrap");

  w.appendChild(el("span", "hash", "content " + d.content_sha256.slice(0, 20)));

  if (!Auth.configured()) {
    w.appendChild(el("span", "hash",
      "· approval service not configured, reading locally. Approve from the " +
      "command line: python tools/approve.py " + d.sunday));
    bar.appendChild(w); return bar;
  }
  if (!Auth.token) {
    w.appendChild(el("span", "hash", "· sign in with Google to record a decision"));
    const box = el("span", "gbtn");
    if (!Auth.drawButton(box)) {
      box.appendChild(el("span", "hash",
        Auth.problem || "· sign-in is still loading, one moment"));
    }
    w.appendChild(box); bar.appendChild(w); return bar;
  }

  const note = el("input", "note");
  note.placeholder = "What did you review? Any caveat.";
  w.appendChild(note);

  const approve = el("button", "btn-approve", "Approve this text");
  const changes = el("button", "btn-changes", "Request changes");

  const blocking = blockingErrors(d.lint);
  if (blocking) {
    approve.disabled = true;
    approve.title = typeof d.lint.new_errors === "number"
      ? `${blocking} rule error(s) introduced since the baseline. Fix those ` +
        `first. The rest are recorded in standards/lint-baseline.json and ` +
        `are not yours to clear here.`
      : `${blocking} rule error(s) outstanding, and this review bundle is too ` +
        `old to say which are new. Regenerate it with tools/make_review.py.`;
  }

  // Exactly the values tools/stpaul/approval.py counts, and the only two
  // the service accepts. It used to be sent "APPROVE" and
  // "REQUEST_CHANGES", which matched neither, and were recorded as
  // approvals.
  approve.onclick = () => submit(d, "approved", note.value, approve, changes);
  changes.onclick = () => submit(d, "changes_requested", note.value, approve, changes);
  w.appendChild(approve); w.appendChild(changes);
  bar.appendChild(w);
  return bar;
}

// The decision goes to the approval service, which verifies the Google
// token, checks the roster, signs the review with a key this page never
// sees, and commits it to the private data repository. The page cannot
// forge an approval even if someone edits the JavaScript, because it has
// nothing to sign with.
async function submit(d, decision, note, ...buttons) {
  buttons.forEach((b) => (b.disabled = true));
  try {
    const r = await fetch(CFG.service + "/approve", {
      method: "POST",
      headers: { ...Auth.headers(), "Content-Type": "application/json" },
      body: JSON.stringify({
        sunday: d.sunday,
        decision,
        note: note || "",
        // The hash shown on screen. The service compares it with the
        // repository's and refuses if the text moved while it was read.
        content_sha256: d.content_sha256,
      }),
    });
    const out = await r.json();
    if (!r.ok) { alert(out.error || "The service refused the request."); return; }
    // What the service recorded, not what this page asked it to. Those
    // two disagreed for the whole of this bug's life, and the page was
    // the one that was wrong: it reported "changes requested" while an
    // approval went into the repository.
    alert(out.decision === "approved"
      ? "Approval recorded for " + out.reviewer + ", bound to content "
        + out.content_sha256.slice(0, 12) + "."
      : "Changes requested. The Sunday stays unapproved.");
    location.reload();
  } catch (e) {
    alert("Could not reach the approval service: " + e.message);
  } finally {
    buttons.forEach((b) => (b.disabled = false));
  }
}

// ---------------------------------------------------------------------
async function render() {
  const main = $("#main");
  main.innerHTML = "";
  $("#churchName").textContent = CFG.churchName || "";

  const signin = $("#signin");
  const who = $("#who");
  const gbtn = $("#gbtn");
  if (!Auth.configured()) {
    signin.classList.add("hidden");
    gbtn.classList.add("hidden");
    who.textContent = "read-only";
  } else if (Auth.token && Auth.user) {
    who.textContent = Auth.user.name + " · " + Auth.user.email;
    gbtn.classList.add("hidden");
    signin.classList.remove("hidden");
    signin.textContent = "Sign out";
    signin.onclick = () => Auth.signOut();
  } else {
    who.textContent = "";
    signin.classList.add("hidden");
    gbtn.classList.remove("hidden");
    Auth.drawButton();
  }

  // Sign-in is impossible. Say that, rather than letting the index fail
  // with "not signed in" and pointing at a button that is not there.
  if (Auth.problem && !Auth.token) {
    main.appendChild(el("div", "banner err", Auth.problem));
    return;
  }

  const slug = location.hash.replace(/^#/, "");
  try {
    if (slug) await viewSunday(main, slug);
    else await viewIndex(main);
  } catch (e) {
    // Say what actually failed. This banner used to name one cause,
    // missing review data, for every failure, so a reader who was merely
    // signed out was told to regenerate files that were already correct,
    // and regenerating them changed nothing. viewSunday reports its own
    // error; the index had no such path and fell through to here.
    //
    // The service writes its errors to be read by a person, so pass them
    // through unchanged. Only "not signed in" is too terse to act on.
    const msg = String((e && e.message) || e);
    const hint = /not signed in/i.test(msg) ? " Sign in with Google, above." : "";
    const text = /[.!?]$/.test(msg) ? msg : msg + ".";
    main.appendChild(el("div", "banner err", text + hint));
  }
}

window.addEventListener("hashchange", render);
window.addEventListener("load", () => { Auth.init(); render(); });
render();
</script>
</body>
</html>
