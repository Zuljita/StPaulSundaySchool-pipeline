<!-- @dsCard group="Type" viewport="700x160" name="Montserrat · labels" subtitle="Always uppercase, always tracked; never inside a sentence" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 14px; background: var(--surface-page); font-family: var(--font-body); color: var(--text-body); }
  p { margin: 0; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .box { width: 30px; height: 18px; flex: none; }
  .hex { font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: 0.06em; color: var(--text-meta); }
  .use { font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 20px; }
</style>
</head>
<body>
<div style="display: grid; gap: 8px;">
  <div style="display: flex; align-items: baseline; gap: 14px;"><span style="font-family: var(--font-label); font-size: var(--size-label); font-weight: var(--weight-label); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-label);">What Children Ask</span><span class="hex">10px 500 · section label</span></div>
  <div style="display: flex; align-items: baseline; gap: 14px;"><span style="font-family: var(--font-label); font-size: var(--size-meta); font-weight: var(--weight-label); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--text-meta);">Month 00, 0000 · Occasion</span><span class="hex">9px 500 · meta and footer</span></div>
  <div style="display: flex; align-items: baseline; gap: 14px;"><span class="hex" style="font-size: var(--size-credit); letter-spacing: var(--track-credit); text-transform: none;">Credit line: translation, hymn licence, authorship.</span><span class="hex">8.5px · credit line</span></div>
  <div style="display: flex; align-items: baseline; gap: 14px;"><span style="background: var(--surface-solid); color: var(--on-solid); padding: var(--chip-pad); font-family: var(--font-label); font-size: var(--size-chip); font-weight: var(--weight-chip); letter-spacing: var(--track-label); text-transform: uppercase;">High School · Teacher’s Guide</span><span class="hex">11.5px 600 · identity chip</span></div>
</div></body>
</html>
