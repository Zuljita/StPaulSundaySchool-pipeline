<!-- @dsCard group="Colors" viewport="700x120" name="Brand blues" subtitle="Sampled from the church logo; two blues carry the identity" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 14px; background: var(--surface-page); font-family: var(--font-body); color: var(--text-body); }
  p { margin: 0; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .box { width: 30px; height: 18px; flex: none; }
  .hex { font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: 0.06em; color: var(--text-meta); }
  .use { font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 20px; }
</style>
</head>
<body>
<div class="grid3">
  <div class="sw"><span class="box" style="background: var(--navy);"></span><span class="hex">082858</span><span class="use">Navy · display, chips, panels</span></div>
  <div class="sw"><span class="box" style="background: var(--blue);"></span><span class="hex">2858b8</span><span class="use">Blue · labels, accents</span></div>
  <div class="sw"><span class="box" style="background: var(--blue-light);"></span><span class="hex">88c8d8</span><span class="use">Light blue · hairlines, tints</span></div>
</div></body>
</html>
