<!-- @dsCard group="Brand" viewport="700x150" name="Logo lockup" subtitle="152px wide, baseline-aligned with the words Sunday School" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 14px; background: var(--surface-page); font-family: var(--font-body); color: var(--text-body); }
  p { margin: 0; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .box { width: 30px; height: 18px; flex: none; }
  .hex { font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: 0.06em; color: var(--text-meta); }
  .use { font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 20px; }
</style>
</head>
<body>
<div style="display: flex; align-items: flex-end; gap: 11px; margin-bottom: 10px;">
  <img src="../assets/stpaul-logo.png" alt="St. Paul Lutheran Church" style="display: block; width: var(--logo-width); height: auto;" />
  <span style="font-family: var(--font-label); font-size: 13px; font-weight: var(--weight-chip); letter-spacing: var(--track-wordmark); text-transform: uppercase; color: var(--text-display); padding-bottom: 1px;">Sunday School</span>
</div>
<p style="font-size: 13px; line-height: var(--lh-body); color: var(--text-secondary);">Reads as one line: St. Paul Sunday School. Baselines align; the wordmark never sits above or below the mark. At 9.5px it becomes the running-header wordmark, set as text.</p></body>
</html>
