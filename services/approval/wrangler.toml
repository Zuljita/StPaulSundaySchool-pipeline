name = "stpaul-approval"
main = "worker.js"
compatibility_date = "2026-01-01"

# Retained, though nothing now requires it: it was here for Ed25519 in the
# Workers runtime, and the approval signing that needed it is gone. Every
# API the Worker still uses (fetch, WebCrypto verify for Google's tokens,
# atob/btoa, TextEncoder) is standard. Dropping the flag is a runtime
# change to a service a reviewer depends on, so it is left for a commit
# that can watch the deploy rather than folded into this one.
compatibility_flags = ["nodejs_compat"]

# The review app is bundled into the Worker as text and served from "/".
# One origin for the page and the API means no CORS pair to keep in sync,
# one custom domain, and no way for the two to disagree about where the
# other one lives.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# The hostname the app is served from. Requires the zone to be on
# Cloudflare DNS. If stpaulaustin.org is hosted elsewhere, either move the
# zone or drop this block and use the workers.dev subdomain, remembering
# that the origin then changes and both ALLOWED_ORIGIN and the Google
# authorised origin must change with it.
[[routes]]
pattern = "schoolreview.stpaulaustin.org"
custom_domain = true

[vars]
# --- public values, safe in git ------------------------------------------

# OAuth client ID from Google Auth Platform > Clients. Public by design:
# it identifies the app, it does not authenticate it. Lives here only, and
# is served to the page in a generated config.js, so there is no second
# copy to drift.
GOOGLE_CLIENT_ID = "345460595880-i89cpopfcv00luj3rkrh5ifrqo4a55vi.apps.googleusercontent.com"

# The private data repository the service reads content from and commits
# approvals to.
DATA_REPO = "Zuljita/StPaulSundaySchool"

# Shown in the app header.
CHURCH_NAME = "St. Paul Lutheran Church, Austin"

# The app is served from this same origin, so this is now a same-origin
# check rather than a cross-origin allowance. Lowercase, always: DNS is
# case-insensitive and the record may read SchoolReview.stpaulaustin.org,
# but browsers send the Origin header lowercased.
ALLOWED_ORIGIN = "https://schoolreview.stpaulaustin.org"

# Optional. The Google Workspace domain reviewers must belong to, checked
# against the token's `hd` claim. The roster in standards/reviewers.yml is
# already an allowlist of specific addresses, so this is defence in depth
# rather than the control: it means an account outside the church cannot
# reach the service at all, even to be rejected by name.
#
# Confirm this matches the Workspace *primary* domain, which is not always
# the same as the website's. A wrong value rejects every reviewer, but it
# says so by name, so the failure is loud and takes seconds to correct.
ALLOWED_HD = "stpaulaustin.org"

# --- secrets, never in git -----------------------------------------------
#
#   npx wrangler secret put GITHUB_TOKEN           # write to DATA_REPO only

# Required, not optional. Together these let the Worker fire a
# `repository_dispatch` at the pipeline repository, which is how an
# approval reaches the site and how the week turns over on Saturday
# night.
#
# This used to be described as optional because publish.yml runs on a
# GitHub schedule too. That schedule is not a safety net in practice: of
# the first thirteen hourly ticks after it went live, one fired, and it
# was thirty-four minutes late. Free-tier Actions cron is delayed or
# dropped under load. Unset these and a lesson a pastor approved may sit
# unpublished for hours.
#
#   npx wrangler secret put PUBLISH_DISPATCH_TOKEN
#
# The token is a fine-grained PAT scoped to the pipeline repository only.
# GitHub documents the classic `repo` scope for the dispatch endpoint and
# is quiet about the fine-grained equivalent, so grant Contents: write
# and confirm from a real approval rather than from this comment: the
# Worker now logs whether GitHub accepted or refused the dispatch, and
# `npx wrangler tail` will say which.
PUBLISH_REPO = "Zuljita/StPaulSundaySchool-pipeline"

# The heartbeat. An approval dispatches for itself; nothing else does,
# and at 9pm on a Saturday the only thing that has happened is that time
# passed. The front page has to be re-rendered for the lesson in use to
# change, so something has to ask for a publish on a schedule.
#
# It is here rather than in GitHub Actions because Actions' cron is the
# part that has already proven unreliable. Cloudflare runs this, GitHub
# does the work. publish.yml keeps its own schedule as a last resort.
#
# Hourly: the turn lands within an hour of 9pm, and the Actions minutes
# stay where publish.yml's own comment reasoned them to.
[triggers]
crons = ["0 * * * *"]
