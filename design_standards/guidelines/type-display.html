<!-- @dsCard group="Type" viewport="700x175" name="Instrument Serif · display" subtitle="Headings, pull quotes, memory verses. Never body copy." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 14px; background: var(--surface-page); font-family: var(--font-body); color: var(--text-body); }
  p { margin: 0; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .box { width: 30px; height: 18px; flex: none; }
  .hex { font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: 0.06em; color: var(--text-meta); }
  .use { font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 20px; }
</style>
</head>
<body>
<p style="font-family: var(--font-display); font-size: var(--size-h1); line-height: var(--lh-display); color: var(--text-display); margin-bottom: 6px;">Lorem ipsum dolor sit amet <span class="hex">38px · h1</span></p>
<p style="font-family: var(--font-display); font-size: var(--size-title); line-height: var(--lh-title); color: var(--text-display); margin-bottom: 6px;">The Lesson <span class="hex">30px · section title</span></p>
<p style="font-family: var(--font-display); font-style: italic; font-size: var(--size-theme); line-height: var(--lh-theme); color: var(--text-label); margin-bottom: 6px;">Your heavenly Father already knows what you need. <span class="hex">22px italic · Theme Line</span></p>
<p style="font-family: var(--font-display); font-size: var(--size-prompt); line-height: var(--lh-quote); color: var(--text-display);">“Why does Jesus talk about birds?” <span class="hex">17px · question prompt</span></p></body>
</html>
