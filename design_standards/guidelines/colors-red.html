<!-- @dsCard group="Colors" viewport="700x110" name="Liturgical red" subtitle="Two jobs only: verse numbers and the Law marker" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 14px; background: var(--surface-page); font-family: var(--font-body); color: var(--text-body); }
  p { margin: 0; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .box { width: 30px; height: 18px; flex: none; }
  .hex { font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: 0.06em; color: var(--text-meta); }
  .use { font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 20px; }
</style>
</head>
<body>
<div style="display: grid; grid-template-columns: 210px 1fr; gap: 24px; align-items: center;">
  <div class="sw"><span class="box" style="background: var(--red);"></span><span class="hex">a81818</span><span class="use">Red</span></div>
  <div style="display: flex; gap: 26px; align-items: center;">
    <p style="font-size: var(--size-scripture-sm);"><sup style="font-family: var(--font-label); font-size: var(--size-verse-number); color: var(--verse-number);">26</sup>Lorem ipsum dolor sit amet…</p>
    <div style="border-top: var(--rule-heavy) solid var(--rule-law); padding-top: 6px; min-width: 132px;">
      <p style="font-family: var(--font-label); font-size: var(--size-chip-sm); font-weight: var(--weight-label); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--rule-law);">The Law</p>
    </div>
  </div>
</div></body>
</html>
