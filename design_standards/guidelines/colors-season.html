<!-- @dsCard group="Colors" viewport="700x120" name="Church year" subtitle="One token, one square in the meta block — the only seasonal variable" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 14px; background: var(--surface-page); font-family: var(--font-body); color: var(--text-body); }
  p { margin: 0; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .box { width: 30px; height: 18px; flex: none; }
  .hex { font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: 0.06em; color: var(--text-meta); }
  .use { font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 20px; }
</style>
</head>
<body>
<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: center;">
  <span style="font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--text-meta);"><span style="color: var(--season-trinity);">■</span> Trinity · 2e6b4b</span>
  <span style="font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--text-meta);"><span style="color: var(--season-red);">■</span> Red · a81818</span>
  <span style="font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--text-meta);"><span style="color: var(--season-violet);">■</span> Violet · 5b3f8c</span>
  <span style="font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--text-meta);"><span style="color: var(--season-blue);">■</span> Blue · 082858</span>
  <span style="font-family: var(--font-label); font-size: var(--size-meta); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--text-meta);"><span style="color: var(--season-gold);">■</span> Gold · c9a227</span>
</div>
<p style="margin-top: 10px; font-size: 13px; line-height: var(--lh-body); color: var(--text-secondary);">Nothing else on the sheet changes with the season.</p></body>
</html>
