name: publish

# The whole loop, end to end: refresh what a reviewer can see, build what
# a pastor has approved, and put it on the site.
#
# WHY THE CURRICULUM PASSES THROUGH HERE
#
# This repository holds no curriculum and must not start. It does not:
# the data repository is checked out into the runner's temp directory,
# outside this checkout entirely, and this job commits nothing here. The
# content exists on a disk that is destroyed when the job ends.
#
# The one thing it does write back is `review/data/`, into the data
# repository, which tools/make_review.py generates from content. That is
# not curriculum prose, it is the rendering of it a reviewer reads, and
# review/README.md already says CI keeps it current. Until something did,
# a Sunday added to content/ was invisible at schoolreview until someone
# remembered to run the tool by hand.
#
# THE ORDER MATTERS
#
#   1. make_review    a new Sunday becomes visible to sign in and review
#   2. build          only what verify() says is approved, right now
#   3. publish_site   re-checks the hash and the approval before staging
#   4. publish_r2     uploads what survived both
#
# Nothing in that chain can publish unapproved text. Step 2 refuses it,
# and step 3 refuses it again against the content as it stands at publish
# time rather than as it stood at build time.

on:
  # The safety net. Webhooks are missed, dispatches fail, and a Sunday
  # approved on Saturday night must not wait for someone to notice.
  schedule:
    - cron: "*/15 * * * *"

  # The fast path. The approval service fires this after it records a
  # decision, so an approval reaches the site in about a minute.
  repository_dispatch:
    types: [approval-recorded, content-changed]

  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Build and stage, but do not upload to R2"
        type: boolean
        default: false

# Two publishes racing would leave whichever finished last in the bucket,
# which is not necessarily the newer content.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pipeline
        uses: actions/checkout@v4

      - name: Check out the curriculum
        uses: actions/checkout@v4
        with:
          repository: Zuljita/StPaulSundaySchool
          token: ${{ secrets.DATA_REPO_TOKEN }}
          # Outside this checkout, so the private content cannot be
          # committed here even by accident.
          path: ${{ runner.temp }}/data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pip install --quiet pyyaml python-docx reportlab pypdf

      - name: Tests
        # Before touching anything the congregation will read. These hold
        # the renderers to determinism and to escaping every string that
        # comes out of content/, and a publish is the wrong moment to
        # find out one of those slipped.
        env:
          STPAUL_DATA: /nonexistent
        run: python -m unittest discover -s tools/tests

      - name: Refresh the review data
        id: review
        env:
          STPAUL_DATA: ${{ runner.temp }}/data
        run: python tools/make_review.py

      - name: Commit the review data if it changed
        working-directory: ${{ runner.temp }}/data
        run: |
          if [ -z "$(git status --porcelain review/data)" ]; then
            echo "No change to review/data."
            exit 0
          fi
          git config user.name "St. Paul Sunday School pipeline"
          git config user.email "noreply@stpaulaustin.org"
          # Only review/data. Nothing else in the curriculum repository is
          # this job's to touch, and `git add -A` here would be a way to
          # commit a half-finished lesson somebody was editing.
          git add review/data
          git commit -m "Refresh review data

          Generated by tools/make_review.py from content/. This is what a
          reviewer reads and what an approval is bound to."
          git push

      - name: Build what is approved
        env:
          STPAUL_DATA: ${{ runner.temp }}/data
        # --approved-only passes over Sundays still waiting on a pastor
        # instead of failing on them. Most of a year is waiting at any
        # moment; that is the normal state, not an error.
        run: python tools/build.py --all --approved-only

      - name: Stage the site
        id: stage
        env:
          STPAUL_DATA: ${{ runner.temp }}/data
        # Exits non-zero when there is nothing publishable at all, which
        # is a legitimate state before the first approval.
        run: |
          if python tools/publish_site.py; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing publishable yet."
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to R2
        if: steps.stage.outputs.staged == 'true' && !inputs.skip_upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/publish_r2.py --staged "${{ runner.temp }}/data/dist-site"

      - name: Say what is live
        if: steps.stage.outputs.staged == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          m = json.loads(pathlib.Path(
              os.environ["RUNNER_TEMP"], "data", "dist-site", "r2-manifest.json"
          ).read_text())
          objs = m["objects"]
          total = sum(o["bytes"] for o in objs)
          print("## Published\n")
          print(f"- {len(objs)} object(s), {total/1024:.0f} KiB")
          print(f"- service worker cache `{m['cache_version']}`\n")
          print("| Sunday | |")
          print("|---|---|")
          for o in objs:
              if o["key"].endswith("/index.html") and o["key"] != "index.html":
                  print(f"| {o['key'].split('/')[0]} | published |")
          PY

      - name: Leave no curriculum behind
        # Belt and braces. The checkout is in the runner's temp directory
        # and this job never commits here, but an empty diff is cheap to
        # assert and the cost of being wrong is publishing copyrighted
        # text into a public repository.
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The pipeline checkout is dirty after a publish:"
            git status --porcelain
            exit 1
          fi
          echo "Clean."
